<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allen - My Virtual Assistant</title>
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000; /* black background */
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    #logo {
      width: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 0 20px #00bfff, 0 0 50px #1e90ff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    #name {
      color: #00bfff;
    }

    #va {
      color: #1e90ff;
    }

    /* Futuristic glowing button */
    #btn {
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: 2px solid #00bfff;
      padding: 14px 30px;
      border-radius: 12px;
      color: #00bfff;
      font-size: 1.1rem;
      cursor: pointer;
      letter-spacing: 1px;
      font-weight: bold;
      transition: all 0.4s ease;
      box-shadow: 0 0 10px #00bfff, inset 0 0 10px #00bfff;
    }

    #btn:hover {
      background: #00bfff;
      color: #000;
      box-shadow: 0 0 25px #00bfff, 0 0 50px #1e90ff, inset 0 0 20px #fff;
      transform: scale(1.1);
    }

    #btn img {
      width: 24px;
      margin-right: 10px;
      filter: invert(58%) sepia(100%) saturate(2000%) hue-rotate(180deg) brightness(105%);
    }
    .robot {
  width: 150px;
  height: 150px;
  background: #1e1e1e;
  border-radius: 20%;
  margin: 0 auto 20px;
  position: relative;
  box-shadow: 0 0 20px #00bfff, 0 0 40px #1e90ff inset;
  display: flex;
  justify-content: center;
  align-items: center;
}

.robot::before {
  content: "🤖"; /* robot emoji */
  font-size: 120px;
  filter: drop-shadow(0 0 5px #00bfff);
  animation: float 3s ease-in-out infinite;
}

.eyes {
  position: absolute;
  top: 45px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
}

.eye {
  width: 15px;
  height: 15px;
  background: #00bfff;
  border-radius: 50%;
  animation: blink 4s infinite;
  box-shadow: 0 0 10px #00bfff;
}

.mouth {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 12px;
  border-radius: 6px;
  background: #00bfff;
  animation: speak 1s infinite;
  box-shadow: 0 0 8px #00bfff;
}

/* Animations */
@keyframes blink {
  0%, 90%, 100% { height: 15px; }
  95% { height: 3px; } /* quick blink */
}

@keyframes speak {
  0%, 100% { height: 12px; }
  50% { height: 4px; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="container">
    <!-- Replace your <img src="logo.jpg"> with this -->
<div class="robot">
  <div class="eyes">
    <span class="eye left"></span>
    <span class="eye right"></span>
  </div>
  <div class="mouth"></div>
</div>

    <h1>I'm <span id="name">Allen</span>, Your <span id="va">Virtual Assistant</span></h1>
    <button id="btn"><img src="mic.svg" alt="mic"><span>Click here to talk to me</span></button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const points = [];
    const pointCount = 50;

    class Point {
      constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
      }

      move() {
        this.x += this.vx;
        this.y += this.vy;
        if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
    }

    // Initialize points
    for(let i=0; i<pointCount; i++){
      points.push(new Point(
        Math.random()*canvas.width, 
        Math.random()*canvas.height, 
        (Math.random()-0.5)*1, 
        (Math.random()-0.5)*1
      ));
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);

      // Draw connections
      for(let i=0; i<points.length; i++){
        for(let j=i+1; j<points.length; j++){
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < 150){
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0,191,255,${1 - dist/150})`; // light blue lines
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.stroke();
          }
        }
      }

      // Draw points
      for(let p of points){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fillStyle = '#00bfff'; // light blue dots
        ctx.fill();
        p.move();
      }

      requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener('resize', ()=>{
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
